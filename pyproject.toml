[project]
name = "quant-analysis"
version = "0.1.0"
description = "S&P 500 volatility strategy research system"
readme = "README.md"
authors = [
    { name = "Zia Arzoo", email = "ziaarzoo21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arch",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "yfinance",
]

[project.scripts]
quant-analysis = "quant_analysis:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_analysis"

